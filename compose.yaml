# =============================================================================
# Guilda — Compose (development)
#
# Services: postgres, redis, localstack (S3), backend, frontend
#
# Usage:
#   cp .env.example .env   # fill in real values first
#   docker compose up      # or: podman compose up
#
# Ports exposed to the host:
#   5432 → 5433  PostgreSQL  (use 5433 from host to avoid conflicts)
#   6379         Redis       (not exposed to host — internal only)
#   4566         LocalStack  (S3-compatible API)
#   4000         Phoenix backend
#   5173         Vite frontend dev server
# =============================================================================

name: guilda

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # --------------------------------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guilda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guilda}
      POSTGRES_DB: ${POSTGRES_DB:-guilda_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-guilda} -d ${POSTGRES_DB:-guilda_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # --------------------------------------------------------------------------
  # Redis 7
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # --------------------------------------------------------------------------
  # LocalStack — S3-compatible local object storage
  # Replaces MinIO (minio/minio requires Docker Hub login).
  # The S3 API is available at http://localstack:4566 inside the network
  # and http://localhost:4566 from the host.
  # --------------------------------------------------------------------------
  localstack:
    # Using localstack:3 — the last free community release (no license required).
    # localstack:latest requires a paid Pro license from v4 onwards.
    image: localstack/localstack:3
    restart: unless-stopped
    environment:
      SERVICES: s3
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-guilda_local}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-guilda_local_secret}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./infra/localstack/init-s3.sh:/etc/localstack/init/ready.d/init-s3.sh:ro
    ports:
      - "4566:4566"
    healthcheck:
      # LocalStack 3 community image has python3 but not curl
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4566/_localstack/health')\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  # --------------------------------------------------------------------------
  # Phoenix backend (Elixir 1.18.3 / OTP 27.3)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-ecto://guilda:guilda@postgres:5432/guilda_dev}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # S3 / LocalStack configuration
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:4566}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-guilda_local}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-guilda_local_secret}
      S3_BUCKET: ${S3_BUCKET:-guilda}
      S3_REGION: ${S3_REGION:-us-east-1}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      APP_URL: ${APP_URL:-http://localhost:4000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:4000/auth/google/callback}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-26214400}
      MIX_ENV: dev
      PHX_HOST: localhost
      PORT: 4000
    volumes:
      - ./backend:/app
      # Persist compiled artifacts across restarts for faster rebuilds
      - backend_build:/app/_build
      - backend_deps:/app/deps
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # --------------------------------------------------------------------------
  # Vite frontend dev server (Node 22.14.0 LTS)
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    environment:
      # Inside the container network, the backend is reachable via service name.
      # The Vite proxy uses this to forward /api and /socket requests.
      VITE_API_URL: http://backend:4000
    volumes:
      - ./frontend:/app
      # Avoid overwriting the container's node_modules with the host's
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  localstack_data:
  backend_build:
  backend_deps:
  frontend_modules:
